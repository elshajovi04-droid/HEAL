<!DOCTYPE html>
<html>

<head>
    <title>HEAL</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-container">

        <!-- Header -->

        <div class="header">

            <div class="header-avatar">
                🐧
            </div>

            <div class="header-info">

                <h1>HEAL</h1>

                <p>Your safe space 💜</p>

            </div>

        </div>


        <!-- Chat Messages -->

        <div class="chat-messages">

            <!-- First HEAL message only -->

            <div class="message-row heal-row">

                <div class="avatar">
                    🐧
                </div>

                <div>

                    <div class="message heal-message">
                        Hey buddy 💗 How are you feeling today?
                    </div>

                    <div class="time heal-time">
                        6:31 AM
                    </div>

                </div>

            </div>

        </div>


        <!-- Input Area -->

        <div class="input-area">

            <input
                type="text"
                placeholder="Type something..."
            >

            <button>➤</button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
